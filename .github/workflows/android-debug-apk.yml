name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build AZORA Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK Platform 36 and Build-Tools 36.0.0 are installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          if [ ! -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-36" ] || [ ! -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Repository currently tracks bun.lock without package-lock.json.
          # Use npm ci only if package-lock.json is present; otherwise use npm install.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run TypeScript lint check
        shell: bash
        run: npm run lint

      - name: Run unit tests
        shell: bash
        run: npm test

      - name: Build production web bundle
        shell: bash
        env:
          CONFIGURED_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${CONFIGURED_API_BASE_URL}" ]]; then
            if [[ "${CONFIGURED_API_BASE_URL}" =~ ^https:// ]]; then
              echo "Building web assets with configured HTTPS VITE_API_BASE_URL repository variable."
              VITE_API_BASE_URL="${CONFIGURED_API_BASE_URL}" npm run build
            else
              echo "::error::VITE_API_BASE_URL repository variable must be a valid https:// URL."
              exit 1
            fi
          else
            echo "VITE_API_BASE_URL is not configured; building web assets with VITE_API_BASE_URL unset."
            npm run build
          fi

      - name: Sync Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle Wrapper
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK output exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected Debug APK was not generated at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
